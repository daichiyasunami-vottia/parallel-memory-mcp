[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "parallel-memory-mcp"
version = "0.1.0"
description = "A memory MCP server that survives parallel agents — SQLite-serialized writes, mirrored into graphify memory docs"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
mcp = ["mcp>=1,<3", "starlette>=1.3.1,<2", "uvicorn>=0.30"]
dev = ["pytest>=8"]

[project.scripts]
parallel-memory = "parallel_memory.__main__:main"

[project.urls]
Homepage = "https://github.com/daichiyasunami-vottia/parallel-memory-mcp"

[tool.setuptools.packages.find]
where = ["src"]
